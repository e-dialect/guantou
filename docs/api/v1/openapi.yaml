openapi: 3.0.3
info:
  title: 乡声集盒 Entry / Recording API
  version: 1.0.0
  description: |
    当前公开领域契约。Entry 是同一个词及其读音身份，EntrySense 是编号义，
    Recording 是一次录音；二者通过带角色的 RecordingEntryLink 多对多关联。
    已退役的 Can、Nameplate、Flavor、Package 与自动选主接口不属于本契约。
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
tags:
  - name: Entries
    description: 词条、编号义和地区读音。
  - name: Recordings
    description: 录音及其与词条的多对多关系。
  - name: Reference
    description: 写法、概念和不可覆写依据。
  - name: Curation
    description: 整理授权、申请、待办和可追溯操作。
  - name: Platform
    description: 客户端能力与隐私最小化的产品事件。
security:
  - bearerAuth: []
paths:
  /entries/:
    get:
      tags: [Entries]
      operationId: listEntries
      summary: 按词条优先查询
      security: []
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: dialect_id, in: query, schema: { type: integer } }
        - { name: dialect_scope, in: query, schema: { type: string, enum: [exact, subtree] } }
        - { name: has_recording, in: query, schema: { type: boolean } }
        - { name: ipa, in: query, schema: { type: string } }
        - { name: romanization, in: query, schema: { type: string } }
      responses:
        "200": { description: 词条列表, content: { application/json: { schema: { $ref: "#/components/schemas/EntryPage" } } } }
    post:
      tags: [Entries]
      operationId: createEntry
      summary: 创建词条初稿
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
  /entries/bookmarks/:
    get:
      tags: [Entries]
      operationId: listEntryBookmarks
      summary: 获取我的词条收藏
      responses:
        "200": { description: 收藏的词条, content: { application/json: { schema: { $ref: "#/components/schemas/EntryPage" } } } }
  /entries/{entry_id}/:
    parameters:
      - { $ref: "#/components/parameters/EntryId" }
    get:
      tags: [Entries]
      operationId: getEntry
      summary: 获取词条详情
      security: []
      responses:
        "200": { description: 词条详情, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
    patch:
      tags: [Entries]
      operationId: updateEntry
      summary: 修订词条
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/EntryV2" } } } }
  /entries/{entry_id}/bookmark/:
    parameters:
      - { $ref: "#/components/parameters/EntryId" }
    put:
      tags: [Entries]
      operationId: bookmarkEntry
      summary: 收藏词条
      responses:
        "200": { description: 收藏状态, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkResult" } } } }
    delete:
      tags: [Entries]
      operationId: unbookmarkEntry
      summary: 取消收藏词条
      responses:
        "200": { description: 收藏状态, content: { application/json: { schema: { $ref: "#/components/schemas/BookmarkResult" } } } }
  /entry-senses/:
    get:
      tags: [Entries]
      operationId: listEntrySenses
      summary: 查询编号义
      security: []
      responses:
        "200": { description: 编号义列表, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySensePage" } } } }
    post:
      tags: [Entries]
      operationId: createEntrySense
      summary: 补充编号义
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
  /entry-senses/{sense_id}/:
    parameters:
      - { $ref: "#/components/parameters/SenseId" }
    get:
      tags: [Entries]
      operationId: getEntrySense
      summary: 获取编号义
      security: []
      responses:
        "200": { description: 编号义, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
    patch:
      tags: [Entries]
      operationId: updateEntrySense
      summary: 修订编号义
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/EntrySenseV2" } } } }
  /writing-forms/:
    get:
      tags: [Reference]
      operationId: listWritingForms
      summary: 查询写法
      security: []
      responses:
        "200": { description: 写法列表, content: { application/json: { schema: { type: object } } } }
  /concepts/:
    get:
      tags: [Reference]
      operationId: listConcepts
      summary: 查询抽象概念
      security: []
      responses:
        "200": { description: 概念列表, content: { application/json: { schema: { type: object } } } }
  /pronunciation-variants/:
    get:
      tags: [Entries]
      operationId: listPronunciationVariants
      summary: 查询地区读音
      security: []
      responses:
        "200": { description: 地区读音列表, content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantPage" } } } }
    post:
      tags: [Entries]
      operationId: createPronunciationVariant
      summary: 补充地区读音
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantV2" } } } }
  /pronunciation-variants/{variant_id}/:
    parameters:
      - { $ref: "#/components/parameters/VariantId" }
    get:
      tags: [Entries]
      operationId: getPronunciationVariant
      summary: 获取地区读音
      security: []
      responses:
        "200": { description: 地区读音, content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantV2" } } } }
    patch:
      tags: [Entries]
      operationId: updatePronunciationVariant
      summary: 修订地区读音
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/PronunciationVariantV2" } } } }
  /recordings/:
    get:
      tags: [Recordings]
      operationId: listRecordings
      summary: 浏览录音流
      security: []
      responses:
        "200": { description: 录音列表, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingPage" } } } }
    post:
      tags: [Recordings]
      operationId: createRecording
      summary: 提交录音及原始大意
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecordingV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingV2" } } } }
  /recordings/{recording_id}/:
    parameters:
      - { $ref: "#/components/parameters/RecordingId" }
    get:
      tags: [Recordings]
      operationId: getRecording
      summary: 获取录音详情
      security: []
      responses:
        "200": { description: 录音详情, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingV2" } } } }
    patch:
      tags: [Recordings]
      operationId: updateRecording
      summary: 修订本人录音元数据
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecordingV2" } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingV2" } } } }
  /recording-entry-links/:
    get:
      tags: [Recordings]
      operationId: listRecordingEntryLinks
      summary: 查询录音与词条关系
      security: []
      responses:
        "200": { description: 关系列表, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingEntryLinkPage" } } } }
    post:
      tags: [Recordings]
      operationId: createRecordingEntryLink
      summary: 提出录音与词条关系
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecordingEntryLinkV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingEntryLinkV2" } } } }
  /recording-entry-links/{link_id}/:
    parameters:
      - { $ref: "#/components/parameters/LinkId" }
    get:
      tags: [Recordings]
      operationId: getRecordingEntryLink
      summary: 获取录音与词条关系
      security: []
      responses:
        "200": { description: 关系详情, content: { application/json: { schema: { $ref: "#/components/schemas/RecordingEntryLinkV2" } } } }
  /usage-attestations/:
    get:
      tags: [Entries]
      operationId: listUsageAttestations
      summary: 查询地区使用补证
      security: []
      responses:
        "200": { description: 补证列表, content: { application/json: { schema: { $ref: "#/components/schemas/UsageAttestationPage" } } } }
    post:
      tags: [Entries]
      operationId: createUsageAttestation
      summary: 确认我这里也这么说
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UsageAttestationV2" } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/UsageAttestationV2" } } } }
  /usage-attestations/{attestation_id}/:
    parameters:
      - { $ref: "#/components/parameters/AttestationId" }
    get:
      tags: [Entries]
      operationId: getUsageAttestation
      summary: 获取地区使用补证
      security: []
      responses:
        "200": { description: 补证详情, content: { application/json: { schema: { $ref: "#/components/schemas/UsageAttestationV2" } } } }
    delete:
      tags: [Entries]
      operationId: retractUsageAttestation
      summary: 撤回本人的地区使用补证
      responses:
        "204": { description: 已撤回 }
  /evidence-records/:
    get:
      tags: [Reference]
      operationId: listEvidenceRecords
      summary: 查询不可覆写的原始依据
      security: []
      responses:
        "200": { description: 依据列表, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceRecordPage" } } } }
  /evidence-records/{evidence_id}/:
    parameters:
      - { $ref: "#/components/parameters/EvidenceId" }
    get:
      tags: [Reference]
      operationId: getEvidenceRecord
      summary: 获取原始依据
      security: []
      responses:
        "200": { description: 原始依据, content: { application/json: { schema: { $ref: "#/components/schemas/EvidenceRecordV2" } } } }
  /curator-grants/:
    get:
      tags: [Curation]
      operationId: listCuratorGrants
      summary: 查询公开整理授权
      security: []
      responses:
        "200": { description: 授权列表, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorGrantPage" } } } }
  /curator-grants/{grant_id}/:
    parameters:
      - { $ref: "#/components/parameters/GrantId" }
    get:
      tags: [Curation]
      operationId: getCuratorGrant
      summary: 获取整理授权
      security: []
      responses:
        "200": { description: 授权详情, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorGrantV2" } } } }
  /curator-applications/:
    get:
      tags: [Curation]
      operationId: listCuratorApplications
      summary: 查询本人或管理员可见的整理申请
      responses:
        "200": { description: 申请列表, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorApplicationPage" } } } }
    post:
      tags: [Curation]
      operationId: createCuratorApplication
      summary: 申请成为整理员
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CuratorApplicationV2" } } }
      responses:
        "201": { description: 已提交, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorApplicationV2" } } } }
  /curator-applications/{application_id}/:
    parameters:
      - { $ref: "#/components/parameters/ApplicationId" }
    get:
      tags: [Curation]
      operationId: getCuratorApplication
      summary: 获取整理申请
      responses:
        "200": { description: 申请详情, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorApplicationV2" } } } }
    delete:
      tags: [Curation]
      operationId: withdrawCuratorApplication
      summary: 撤回待审申请
      responses:
        "204": { description: 已撤回 }
  /curator-applications/{application_id}/review/:
    parameters:
      - { $ref: "#/components/parameters/ApplicationId" }
    post:
      tags: [Curation]
      operationId: reviewCuratorApplication
      summary: 审核整理申请
      responses:
        "200": { description: 已审核, content: { application/json: { schema: { $ref: "#/components/schemas/CuratorApplicationV2" } } } }
  /curation/actions/:
    get:
      tags: [Curation]
      operationId: listCurationActions
      summary: 查询公开整理履历
      security: []
      responses:
        "200": { description: 整理操作列表, content: { application/json: { schema: { $ref: "#/components/schemas/CurationActionPage" } } } }
    post:
      tags: [Curation]
      operationId: createCurationAction
      summary: 提交可追溯整理操作
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CurationActionV2" } } }
      responses:
        "201": { description: 已执行, content: { application/json: { schema: { $ref: "#/components/schemas/CurationActionV2" } } } }
  /curation/actions/{action_id}/:
    parameters:
      - { $ref: "#/components/parameters/ActionId" }
    get:
      tags: [Curation]
      operationId: getCurationAction
      summary: 获取整理操作
      security: []
      responses:
        "200": { description: 整理操作, content: { application/json: { schema: { $ref: "#/components/schemas/CurationActionV2" } } } }
  /curation/:
    get:
      tags: [Curation]
      operationId: getCurationWorkbench
      summary: 获取当前整理权限和待办数
      responses:
        "200": { description: 整理工作台摘要, content: { application/json: { schema: { type: object } } } }
  /curation/tasks/:
    get:
      tags: [Curation]
      operationId: listCurationTasks
      summary: 获取整理待办
      responses:
        "200": { description: 整理待办, content: { application/json: { schema: { type: object } } } }
  /contributions/me/:
    get:
      tags: [Curation]
      operationId: getMyContributionHistory
      summary: 获取我的录音、补证、修订与地区足迹
      responses:
        "200": { description: 贡献履历, content: { application/json: { schema: { type: object } } } }
  /site-settings/capabilities:
    get:
      tags: [Platform]
      operationId: getCapabilities
      summary: 获取编译能力与远程开关的交集
      security: []
      responses:
        "200": { description: 能力矩阵, content: { application/json: { schema: { $ref: "#/components/schemas/CapabilitySwitches" } } } }
  /product-events/:
    post:
      tags: [Platform]
      operationId: createProductEvent
      summary: 记录去标识化产品事件
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProductEventWrite" } } }
      responses:
        "201": { description: 已记录 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    EntryId: { name: entry_id, in: path, required: true, schema: { type: integer } }
    SenseId: { name: sense_id, in: path, required: true, schema: { type: integer } }
    VariantId: { name: variant_id, in: path, required: true, schema: { type: integer } }
    RecordingId: { name: recording_id, in: path, required: true, schema: { type: integer } }
    LinkId: { name: link_id, in: path, required: true, schema: { type: integer } }
    AttestationId: { name: attestation_id, in: path, required: true, schema: { type: integer } }
    EvidenceId: { name: evidence_id, in: path, required: true, schema: { type: integer } }
    GrantId: { name: grant_id, in: path, required: true, schema: { type: integer } }
    ApplicationId: { name: application_id, in: path, required: true, schema: { type: integer } }
    ActionId: { name: action_id, in: path, required: true, schema: { type: integer } }
  schemas:
    DialectRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        qualified_code: { type: string, description: 仅供 API、历史映射和管理工具使用 }
        path_names: { type: array, items: { type: string } }
        sort_order: { type: integer }
    UserRef:
      type: object
      nullable: true
      properties:
        id: { type: integer, nullable: true }
        username: { type: string }
        nickname: { type: string }
    EntryV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        display_writing: { type: string, readOnly: true }
        summary: { type: string }
        identity_note: { type: string }
        usage_dialect: { $ref: "#/components/schemas/DialectRef" }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
        visibility: { type: boolean }
        recording_count: { type: integer, readOnly: true }
        needs_audio: { type: boolean, readOnly: true }
        is_bookmarked: { type: boolean, readOnly: true }
        senses: { type: array, items: { $ref: "#/components/schemas/EntrySenseV2" }, readOnly: true }
        pronunciation_variants: { type: array, items: { $ref: "#/components/schemas/PronunciationVariantV2" }, readOnly: true }
        recording_links: { type: array, items: { $ref: "#/components/schemas/RecordingEntryLinkV2" }, readOnly: true }
    EntrySenseV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        sense_number: { type: integer }
        gloss: { type: string }
        usage_note: { type: string }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
        concepts: { type: array, items: { type: object }, readOnly: true }
    PronunciationVariantV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        ipa: { type: string }
        base_romanization: { type: string }
        surface_romanization: { type: string }
        reading_type: { type: string }
        status: { type: string, enum: [draft, reviewed, disputed, rejected] }
    RecordingV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        audio_url: { type: string, format: uri }
        usage_dialect: { $ref: "#/components/schemas/DialectRef" }
        original_gloss: { type: string }
        recording_type: { type: string, enum: [word, phrase, sentence, narrative] }
        status: { type: string, enum: [draft, published, disputed, rejected] }
        visibility: { type: boolean }
        entry_links: { type: array, items: { $ref: "#/components/schemas/RecordingEntryLinkV2" }, readOnly: true }
    RecordingEntryLinkV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        recording: { type: integer }
        entry: { type: integer }
        role: { type: string, enum: [primary, mention, competing] }
        status: { type: string, enum: [suggested, accepted, disputed, rejected] }
        is_current: { type: boolean }
    UsageAttestationV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        entry: { type: integer }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        attester: { $ref: "#/components/schemas/UserRef" }
        active: { type: boolean }
    EvidenceRecordV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        source_type: { type: string }
        original_text: { type: string }
        original_writing: { type: string }
        original_gloss: { type: string }
        original_pronunciation: { type: string }
        citation: { type: string }
    CuratorGrantV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        user: { $ref: "#/components/schemas/UserRef" }
        role: { type: string, enum: [lexical, regional] }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        reason: { type: string }
        is_active: { type: boolean, readOnly: true }
    CuratorApplicationV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        applicant: { $ref: "#/components/schemas/UserRef" }
        role: { type: string, enum: [lexical, regional] }
        dialect: { $ref: "#/components/schemas/DialectRef" }
        statement: { type: string }
        experience: { type: string }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        review_reason: { type: string }
    CurationActionV2:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        actor: { $ref: "#/components/schemas/UserRef" }
        action_type: { type: string }
        target_type: { type: string }
        target_id: { type: integer }
        before_snapshot: { type: object, readOnly: true }
        after_snapshot: { type: object, readOnly: true }
        reason: { type: string }
        evidence_ids: { type: array, items: { type: integer } }
    CapabilitySwitches:
      type: object
      properties:
        listen_feed: { type: boolean }
        entry_search: { type: boolean }
        recording: { type: boolean }
        usage_attestation: { type: boolean }
        curation_workbench: { type: boolean }
        wechat_auth: { type: boolean }
    ProductEventWrite:
      type: object
      required: [session_id, event_name, platform, surface, result]
      properties:
        session_id: { type: string }
        event_name: { type: string }
        platform: { type: string }
        surface: { type: string }
        result: { type: string }
        metadata: { type: object }
    BookmarkResult:
      type: object
      properties:
        entry_id: { type: integer }
        bookmarked: { type: boolean }
