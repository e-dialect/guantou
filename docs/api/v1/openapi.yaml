  /comments/:
    get:
      tags: [Comments]
      operationId: listComments
      summary: 列出顶层评论或某条一级评论下的回复
      description: >-
        二级评论层级：不带 parent_id 时返回顶层评论（parent 为空）并按时间倒序，
        附带 reply_count；带 parent_id 时返回该一级评论下的全部回复（二层平铺、时间正序）。
        仅在不带 parent_id 的顶层列表，can_id 与 nameplate_id 才必须且只能提供一个；
        带 parent_id 时无需提供目标。游客可浏览公开罐头的评论（见 #202）。
      security: []
      parameters:
        - name: can_id
          in: query
          schema: { type: integer }
          description: 罐头 id；不带 parent_id 的顶层列表时与 nameplate_id 二选一。
        - name: nameplate_id
          in: query
          schema: { type: integer }
          description: 铭牌 id；不带 parent_id 的顶层列表时与 can_id 二选一。
        - name: parent_id
          in: query
          schema: { type: integer }
          description: 一级评论 id；提供时返回其下的回复列表，且无需 can_id/nameplate_id。
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 评论分页列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Comments]
      operationId: createComment
      summary: 发表评论或回复
      description: >-
        顶层评论提交 can_id 或 nameplate_id 与 content；回复提交 reply_to_id（被直接
        回复的评论 id，可为一级评论或另一条回复）与 content，后端据此推导所属一级评论
        parent 与展示用 reply_to。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentWrite" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /comments/{comment_id}/:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Comments]
      operationId: getComment
      summary: 获取单条评论
      security: []
      responses:
        "200":
          description: 评论详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Comments]
      operationId: updateComment
      summary: 修改本人评论正文
      description: 目标（can/nameplate/parent/reply_to）创建后不可修改；仅本人可改正文，故只接受 content。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommentUpdate" }
      responses:
        "200":
          description: 修改后的评论
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: 删除本人评论
      description: 删除顶层评论会级联移除其下回复；删除回复仅移除该条。
      security:
        - bearerAuth: []
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /comments/{comment_id}/like/:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Comments]
      operationId: likeComment
      summary: 点赞评论
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前点赞状态
          content:
