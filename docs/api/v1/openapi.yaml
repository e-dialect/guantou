        id: { type: integer }
        user: { $ref: "#/components/schemas/UserRef" }
        role: { type: string, enum: [lexical_curator, regional_curator] }
        dialect: { oneOf: [{ $ref: "#/components/schemas/DialectRef" }, { type: "null" }] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        granted_by: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
        reason: { type: string }
        revoked_at: { type: [string, "null"], format: date-time }
        revocation_reason: { type: string }
        is_active: { type: boolean }
    CurationSummaryV2:
      type: object
      required: [grants, pending]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/CuratorGrantV2" }
        pending:
          type: object
          required: [legacy_candidates, disputed_entries, disputed_recordings, disputed_recording_links]
          properties:
            legacy_candidates: { type: integer, minimum: 0 }
            disputed_entries: { type: integer, minimum: 0 }
            disputed_recordings: { type: integer, minimum: 0 }
            disputed_recording_links: { type: integer, minimum: 0 }

    LegacyReviewCandidateV2:
      type: object
      required: [id, source_system, candidate_key, candidate_type, entries, source_ids, payload, status]
      properties:
        id: { type: integer }
        source_system: { type: string }
        candidate_key: { type: string }
        candidate_type:
          type: string
          enum: [sense_segmentation, numbering_anomaly, pronunciation_variation, entry_split, possible_duplicate]
        primary_entry: { oneOf: [{ $ref: "#/components/schemas/EntryRefV2" }, { type: "null" }] }
        entries: { type: array, items: { $ref: "#/components/schemas/EntryRefV2" } }
        source_ids: { type: array, items: { type: integer } }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, accepted, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LegacyReviewCandidateV2Page:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/LegacyReviewCandidateV2" }
