        - name: package_id
          in: query
          schema: { type: integer }
        - name: flavor_id
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/DialectFilter"
        - $ref: "#/components/parameters/DialectScope"
        - name: pronunciation_id
          in: query
          schema: { type: integer }
        - name: creator_id
          in: query
          schema: { type: integer }
        - name: source_type
          in: query
