      type: object
      required: [id, parent_id, reply_to, author, content, like_count, liked_by_me, reply_count, created_at]
      properties:
        id: { type: integer }
        can_id: { oneOf: [{ type: integer }, { type: "null" }] }
        nameplate_id: { oneOf: [{ type: integer }, { type: "null" }] }
        parent_id:
          oneOf:
            - { type: integer }
            - { type: "null" }
          description: 所属一级评论 id；顶层评论为 null。
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
