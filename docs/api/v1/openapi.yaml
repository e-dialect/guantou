    post:
      tags: [Nameplates]
      operationId: createNameplate
      summary: 创建一条带来源的资料主张
      description: can_id 必填；至少提交一个规范外键或原样内容字段。若 pronunciation_id 与其他外键矛盾，返回 409。
      security:
        - bearerAuth: []
      requestBody:
        required: true
