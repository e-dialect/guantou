    parameters:
      - $ref: "#/components/parameters/NameplateId"
    get:
      tags: [Nameplates]
      operationId: getNameplate
      summary: 获取铭牌详情
      security: []
      responses:
        "200":
          description: 铭牌详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NameplateDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Nameplates]
      operationId: updateNameplate
      summary: 修改尚未被引用的本人铭牌
      description: 已获支持、已成为主铭牌或已被引用的语义内容不可原地修改；使用 supersedes_id 创建修订记录。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameplateUpdate" }
      responses:
        "200":
          description: 修改后的铭牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NameplateDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Nameplates]
      operationId: deleteNameplate
      summary: 撤回本人铭牌
      description: 对已公开或被引用的铭牌执行软撤回并保留来源 tombstone；只有未公开且无引用的草稿可物理删除。
      security:
        - bearerAuth: []
      responses:
        "204": { description: 已撤回；历史来源和引用关系继续保留 }
