  /pronunciation-variants/:
    get:
      tags: [EntriesV2]
      operationId: listPronunciationVariantsV2
      summary: 查询词条在不同地区的读音变化
      security: []
      parameters:
        - { name: entry_id, in: query, schema: { type: integer } }
        - { name: dialect_id, in: query, schema: { type: integer } }
        - { name: dialect_scope, in: query, schema: { type: string, enum: [exact, subtree], default: exact } }
        - { name: ipa, in: query, schema: { type: string } }
        - { name: romanization, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 地区读音分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationVariantV2Page" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [EntriesV2]
      operationId: createPronunciationVariantV2
      summary: 补充词条地区读音
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PronunciationVariantV2Write" }
      responses:
        "201":
          description: 地区读音
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationVariantV2" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /pronunciation-variants/{variant_id}/:
    parameters:
      - { name: variant_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [EntriesV2]
      operationId: getPronunciationVariantV2
      summary: 获取地区读音
      security: []
      responses:
        "200":
          description: 地区读音详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationVariantV2" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [EntriesV2]
      operationId: updatePronunciationVariantV2
      summary: 修订地区读音
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PronunciationVariantV2Write" }
      responses:
        "200":
          description: 修订后的地区读音
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationVariantV2" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recordings/:
    get:
      tags: [RecordingsV2]
      operationId: listRecordingsV2
      summary: 查询录音及其词条关系
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: entry_id, in: query, schema: { type: integer } }
        - { name: role, in: query, schema: { type: string, enum: [primary, mention, competing] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: has_entry, in: query, schema: { type: boolean } }
        - { name: dialect_id, in: query, schema: { type: integer } }
        - { name: dialect_scope, in: query, schema: { type: string, enum: [exact, subtree], default: exact } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 录音分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingV2Page" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [RecordingsV2]
      operationId: createRecordingV2
      summary: 按录音、使用地区和大意提交；没有现成词条时自动建立初稿词条
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingV2Write" }
      responses:
        "201":
          description: 录音、初始主词条关系和不可覆写证据
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingV2" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /recordings/{recording_id}/:
    parameters:
      - { name: recording_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [RecordingsV2]
      operationId: getRecordingV2
      summary: 获取录音及主要、句中和竞争词条关系
      security: []
      responses:
        "200":
          description: 录音详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingV2" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [RecordingsV2]
      operationId: updateRecordingV2
      summary: 由录制者或地区整理员修订录音资料
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingV2Write" }
      responses:
        "200":
          description: 修订后的录音；原始材料作为新证据追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingV2" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recording-entry-links/:
    get:
      tags: [RecordingsV2]
      operationId: listRecordingEntryLinksV2
      summary: 查询录音与词条的当前或历史关系
      security: []
      parameters:
        - { name: recording_id, in: query, schema: { type: integer } }
        - { name: entry_id, in: query, schema: { type: integer } }
        - { name: role, in: query, schema: { type: string, enum: [primary, mention, competing] } }
        - { name: status, in: query, schema: { type: string } }
        - { name: is_current, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 关系分页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingEntryLinkV2Page" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [RecordingsV2]
      operationId: createRecordingEntryLinkV2
      summary: 提出句中词或竞争解释；已有主词条不会被自动替换
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingEntryLinkV2Write" }
      responses:
        "201":
          description: 新关系
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingEntryLinkV2" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /recording-entry-links/{link_id}/:
    parameters:
      - { name: link_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [RecordingsV2]
      operationId: getRecordingEntryLinkV2
      summary: 获取录音词条关系
      security: []
      responses:
        "200":
          description: 关系详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingEntryLinkV2" }
        "404": { $ref: "#/components/responses/NotFound" }

  /usage-attestations/:
    get:
      tags: [RecordingsV2]
      operationId: listUsageAttestationsV2
      summary: 查询“我这里也这么说”的地区范围确认
      security: []
      parameters:
        - { name: entry_id, in: query, schema: { type: integer } }
        - { name: dialect_id, in: query, schema: { type: integer } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 使用确认分页；父节点确认不推断所有子节点
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageAttestationV2Page" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [RecordingsV2]
      operationId: createUsageAttestationV2
      summary: 在用户明确选择的地区范围确认词条使用
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageAttestationV2Write" }
      responses:
        "201":
          description: 使用确认
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageAttestationV2" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /usage-attestations/{attestation_id}/:
    parameters:
      - { name: attestation_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [RecordingsV2]
      operationId: getUsageAttestationV2
      summary: 获取使用确认
      security: []
      responses:
        "200":
          description: 使用确认详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageAttestationV2" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [RecordingsV2]
      operationId: deactivateUsageAttestationV2
      summary: 撤回本人的使用确认并保留历史记录
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 已撤回 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /evidence-records/:
    get:
      tags: [CurationV2]
      operationId: listEvidenceRecordsV2
      summary: 查询与可见词条或录音有关的不可覆写证据
      security: []
      parameters:
        - { name: source_type, in: query, schema: { type: string } }
        - { name: entry_id, in: query, schema: { type: integer } }
        - { name: recording_id, in: query, schema: { type: integer } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 证据分页；敏感来源元数据仅向贡献者和整理员展开
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceRecordV2Page" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /evidence-records/{evidence_id}/:
    parameters:
      - { name: evidence_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [CurationV2]
      operationId: getEvidenceRecordV2
      summary: 获取不可覆写证据
      security: []
      responses:
        "200":
          description: 证据详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceRecordV2" }
        "404": { $ref: "#/components/responses/NotFound" }

  /curation/:
    get:
      tags: [CurationV2]
      operationId: getCurationSummaryV2
      summary: 获取当前整理员授权范围和待办计数
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 整理工作概况
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurationSummaryV2" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /curation/legacy-candidates/:
    get:
      tags: [CurationV2]
      operationId: listLegacyReviewCandidatesV2
      summary: 查询旧库分义、拆分、读音差异和可能重复候选
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: candidate_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 只读审核候选分页；本阶段不自动执行裁决
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyReviewCandidateV2Page" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /curation/legacy-candidates/{candidate_id}/:
    parameters:
      - { name: candidate_id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [CurationV2]
      operationId: getLegacyReviewCandidateV2
      summary: 获取旧库审核候选及原始材料
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 审核候选详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyReviewCandidateV2" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Search:
      name: search
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
    DialectScope:
      name: dialect_scope
      in: query
      schema: { type: string, enum: [exact, subtree], default: exact }
    DialectFilter:
      name: dialect_id
      in: query
      schema: { type: integer }
      description: 规范方言筛选；查询 Can 时通过 active Nameplate 的方言主张匹配。
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: integer }
    DialectId:
      name: dialect_id
      in: path
      required: true
      schema: { type: integer }
    PackageId:
      name: package_id
      in: path
      required: true
      schema: { type: integer }
    FlavorId:
      name: flavor_id
      in: path
      required: true
      schema: { type: integer }
    PronunciationId:
      name: pronunciation_id
      in: path
      required: true
      schema: { type: integer }
    CanId:
      name: can_id
      in: path
      required: true
      schema: { type: integer }
    NameplateId:
      name: nameplate_id
      in: path
      required: true
      schema: { type: integer }
    ShelfId:
      name: shelf_id
      in: path
      required: true
      schema: { type: integer }
    ThemeId:
      name: theme_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    DecorationId:
      name: decoration_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    ThemeItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    ThemeMixId:
      name: mix_id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    ThemeKeyword:
      name: keyword
      in: query
      schema: { type: string, maxLength: 64 }
    ThemePrivilege:
      name: privilege_type
      in: query
      schema: { $ref: "#/components/schemas/ThemePrivilegeType" }
    ThemeStyleTag:
      name: style_tag
      in: query
      schema: { type: string }
    ThemeDialectTag:
      name: dialect_tag
      in: query
      schema: { type: string }
    ThemeStatus:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/ThemeItemStatus" }
    ThemeSort:
      name: sort
      in: query
      schema: { type: string, enum: [newest, heat, free, name] }
    ThemeTerminal:
      name: support_terminal
      in: query
      schema: { $ref: "#/components/schemas/ThemePlatform" }
    ThemePlatform:
      name: platform
      in: query
      schema: { $ref: "#/components/schemas/ThemePlatform" }
    ThemeComponentType:
      name: component_type
      in: query
      schema: { $ref: "#/components/schemas/ThemeComponentType" }
    ThemePage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ThemePageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  responses:
    BadRequest:
      description: 请求或字段校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未认证或凭证失效
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 无操作权限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 当前状态、关联或唯一约束冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: 文件超过允许大小
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: 不支持的媒体类型
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message, data, request_id]
      properties:
        code: { type: integer, minimum: 400, maximum: 599, example: 401 }
        message: { type: string, example: 请先登录 }
        data:
          type: object
          properties:
            reason:
              type: string
              pattern: "^[a-z0-9_]+$"
              description: 同一 HTTP 状态下需要程序区分原因时使用的稳定标识。
              example: token_expired
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/FieldError"
              - type: array
                items: { $ref: "#/components/schemas/FieldError" }
              - $ref: "#/components/schemas/FieldErrors"
        request_id: { type: string, example: 7f2c1a90-0000-4000-8000-000000000000 }

    FieldError:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: required }
        message: { type: string, example: 该字段是必填项。 }
    FieldErrors:
      type: object
      additionalProperties:
        oneOf:
          - $ref: "#/components/schemas/FieldError"
          - type: array
            items: { $ref: "#/components/schemas/FieldError" }
          - $ref: "#/components/schemas/FieldErrors"

    PageBase:
      type: object
      required: [count, next, previous, results]
      properties:
        count: { type: integer, minimum: 0 }
        next: { type: [string, "null"], format: uri-reference }
        previous: { type: [string, "null"], format: uri-reference }

    ThemePlatform:
      type: string
      enum: [h5, miniprogram]
    ThemePrivilegeType:
      type: string
      enum: [free, member, activity, creator]
    ThemeItemStatus:
      type: string
      enum: [available, coming, deprecated]
    ThemeItemType:
      type: string
      enum: [theme, decoration]
    ThemeComponentType:
      type: string
      enum:
        - nav_bar
        - tab_bar
        - button
        - card
        - home_bg
        - avatar_frame
        - comment_bubble
        - topic_card
        - input_box
    ThemeItemSelection:
      type: object
      required: [item_type, item_id]
      properties:
        item_type: { $ref: "#/components/schemas/ThemeItemType" }
        item_id: { type: string, minLength: 1, maxLength: 64 }
    ThemeCatalogFields:
      type: object
      required:
        - name
        - desc
        - cover_img
        - detail_img
        - poster_img
        - style_tags
        - dialect_tags
        - privilege_type
        - get_condition
        - status
        - support_terminal
        - activity_start_at
        - activity_end_at
        - like_count
        - collect_count
        - share_count
        - create_time
      properties:
        name: { type: string, maxLength: 80 }
        desc: { type: string }
        cover_img: { type: string, maxLength: 255 }
        detail_img: { type: string, maxLength: 255 }
        poster_img: { type: string, maxLength: 255 }
        style_tags:
          type: array
          items: { type: string }
        dialect_tags:
          type: array
          items: { type: string }
        privilege_type: { $ref: "#/components/schemas/ThemePrivilegeType" }
        get_condition: { type: string, maxLength: 200 }
        status: { $ref: "#/components/schemas/ThemeItemStatus" }
        support_terminal:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/ThemePlatform" }
        activity_start_at: { type: [string, "null"], format: date-time }
        activity_end_at: { type: [string, "null"], format: date-time }
        like_count: { type: integer, minimum: 0, readOnly: true }
        collect_count: { type: integer, minimum: 0, readOnly: true }
        share_count: { type: integer, minimum: 0, readOnly: true }
        create_time: { type: string, format: date-time, readOnly: true }
    ThemeItem:
      allOf:
        - { $ref: "#/components/schemas/ThemeCatalogFields" }
        - type: object
          required: [theme_id]
          properties:
            theme_id: { type: string, maxLength: 64 }
    ThemeItemDetail:
      allOf:
        - { $ref: "#/components/schemas/ThemeItem" }
        - type: object
          required: [style_json]
          properties:
            style_json:
              type: object
              additionalProperties: true
    DecorationItem:
      allOf:
        - { $ref: "#/components/schemas/ThemeCatalogFields" }
        - type: object
          required: [decoration_id, component_type, group]
          properties:
            decoration_id: { type: string, maxLength: 64 }
            component_type: { $ref: "#/components/schemas/ThemeComponentType" }
            group: { type: string, maxLength: 64 }
    DecorationItemDetail:
      allOf:
        - { $ref: "#/components/schemas/DecorationItem" }
        - type: object
          required: [style_json]
          properties:
            style_json:
              type: object
              additionalProperties: true
    ThemeCatalogPage:
      allOf:
        - { $ref: "#/components/schemas/PageBase" }
        - type: object
          required: [catalog_version]
          properties:
            catalog_version: { type: integer, minimum: 1 }
            results:
              type: array
              items: { $ref: "#/components/schemas/ThemeItem" }
    DecorationCatalogPage:
      allOf:
        - { $ref: "#/components/schemas/PageBase" }
        - type: object
          required: [catalog_version]
          properties:
            catalog_version: { type: integer, minimum: 1 }
            results:
              type: array
              items: { $ref: "#/components/schemas/DecorationItem" }
    ThemeRecentUse:
      type: object
      required: [item_id, item_type, use_time]
      properties:
        item_id: { type: string, maxLength: 64 }
        item_type: { $ref: "#/components/schemas/ThemeItemType" }
        use_time: { type: integer, minimum: 0 }
    UserThemeConfig:
      type: object
      required:
        - global_theme_id
        - decoration_map
        - is_cover_local_decoration
        - recent_use_list
      properties:
        global_theme_id: { type: string, maxLength: 64 }
        decoration_map:
          type: object
          additionalProperties: { type: string, maxLength: 64 }
        is_cover_local_decoration: { type: boolean }
        recent_use_list:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/ThemeRecentUse" }
    UserThemeConfigWrite:
      allOf:
        - { $ref: "#/components/schemas/UserThemeConfig" }
        - type: object
          properties:
            platform: { $ref: "#/components/schemas/ThemePlatform" }
    UserThemeCollect:
      type: object
      required: [item_id, item_type, collect_time]
      properties:
        item_id: { type: string, maxLength: 64 }
        item_type: { $ref: "#/components/schemas/ThemeItemType" }
        collect_time: { type: string, format: date-time, readOnly: true }
    UserThemeMix:
      type: object
      required:
        - mix_id
        - mix_name
        - global_theme_id
        - decoration_ids
        - decoration_map
        - is_cover_local_decoration
        - create_time
      properties:
        mix_id: { type: string, maxLength: 64 }
        mix_name: { type: string, minLength: 1, maxLength: 20 }
        global_theme_id: { type: string, maxLength: 64 }
        decoration_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        decoration_map:
          type: object
          additionalProperties: { type: string, maxLength: 64 }
        is_cover_local_decoration: { type: boolean }
        create_time: { type: string, format: date-time, readOnly: true }
    UserThemeMixWrite:
      type: object
      required: [mix_name, global_theme_id]
      properties:
        mix_id: { type: string, maxLength: 64 }
        mix_name: { type: string, minLength: 1, maxLength: 20 }
        global_theme_id: { type: string, maxLength: 64 }
        decoration_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
        decoration_map:
          type: object
          additionalProperties: { type: string, maxLength: 64 }
        is_cover_local_decoration: { type: boolean, default: true }
    UserThemeEntitlement:
      type: object
      required: [is_member, creator_unlocked, activity_ids]
      properties:
        is_member: { type: boolean, readOnly: true }
        creator_unlocked: { type: boolean, readOnly: true }
        activity_ids:
          type: array
          uniqueItems: true
          items: { type: string, maxLength: 64 }

    UserRef:
      type: object
      required: [id, username, nickname, avatar]
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string, format: uri-reference }
    UserPublicProfile:
      allOf:
        - $ref: "#/components/schemas/UserRef"
        - type: object
          required: [title, level]
          properties:
            title: { type: string }
            level: { type: integer, minimum: 1 }
            primary_dialect: { oneOf: [{ $ref: "#/components/schemas/DialectRef" }, { type: "null" }] }
    UserContribution:
      type: object
      required: [cans, flavors, nameplates, views]
      properties:
        cans: { type: integer, minimum: 0, description: 公开罐头数 }
        flavors: { type: integer, minimum: 0, description: 公开义项数 }
        nameplates: { type: integer, minimum: 0, description: 公开铭牌数 }
        views:
          type: integer
          minimum: 0
          description: 罐头浏览累计；访客按公开罐头，本人按全部上传罐头
        cans_uploaded: { type: integer, minimum: 0, description: 仅本人返回，含未公开罐头 }
        flavors_uploaded: { type: integer, minimum: 0, description: 仅本人返回，含未公开义项 }
        nameplates_uploaded: { type: integer, minimum: 0, description: 仅本人返回，含未公开铭牌 }
    UserProfileResponse:
      type: object
      required: [user, contribution]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/UserPublicProfile"
            - $ref: "#/components/schemas/UserPrivateProfile"
        contribution:
          $ref: "#/components/schemas/UserContribution"
        notification:
          type: object
          description: 仅本人返回
          properties:
            statistics:
              type: object
              properties:
                total: { type: integer, minimum: 0 }
                sent: { type: integer, minimum: 0 }
                received: { type: integer, minimum: 0 }
                unread: { type: integer, minimum: 0 }
    UserPrivateProfile:
      allOf:
        - $ref: "#/components/schemas/UserPublicProfile"
        - type: object
          required: [email, telephone, is_staff, wechat_bound, registered_at]
          properties:
            email: { type: string, format: email }
            telephone: { type: string }
            birthday: { type: [string, "null"], format: date }
            is_staff: { type: boolean }
            wechat_bound: { type: boolean }
            registered_at: { type: string, format: date-time }
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 20
          description: 登录用户名；修改后旧 token 失效，响应会带新 token
        nickname: { type: string, maxLength: 100 }
        avatar: { type: string, format: uri-reference }
        telephone: { type: string, maxLength: 50 }
        birthday: { type: [string, "null"], format: date }
        primary_dialect_id: { type: [integer, "null"] }
    UserUpdateRequest:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/UserUpdate" }
    UserUpdateResult:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/UserPrivateProfile" }
        token: { type: string }
    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/UserRef" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    RegisterRequest:
      allOf:
        - $ref: "#/components/schemas/LoginRequest"
        - type: object
          required: [email, code]
          properties:
            email: { type: string, format: email }
            code: { type: string }
            nickname: { type: string }
            avatar: { type: string, format: uri-reference }
    AuthToken:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/UserRef" }

    DialectRef:
      type: object
      required: [id, name, code, qualified_code, sort_order]
      properties:
        id: { type: integer }
        name: { type: string }
        code:
          type: string
          pattern: '^[^./\s]+$'
          example: 游洋
          description: 同级唯一短码，默认使用社区熟悉的中文简称，不得包含点、斜杠或空白。
        qualified_code:
          type: string
          example: 闽.莆仙.仙游.游洋
          description: 从根到叶拼接的规范限定码；用于解析和前缀聚合，不作为外键。
        sort_order:
          type: integer
          default: 0
          description: 同级人工顺序；客户端按 sort_order、id 排列，不依赖 Unicode 字典序。
    DialectDetail:
      allOf:
        - $ref: "#/components/schemas/DialectRef"
        - type: object
          required: [aliases, children_count, description]
          properties:
            parent: { oneOf: [{ $ref: "#/components/schemas/DialectRef" }, { type: "null" }] }
            ancestors:
              type: array
              items: { $ref: "#/components/schemas/DialectRef" }
            children:
              type: array
              items: { $ref: "#/components/schemas/DialectRef" }
            aliases:
              type: array
              uniqueItems: true
              items: { type: string }
            children_count: { type: integer, minimum: 0 }
            description: { type: string }
            external_refs:
              type: object
              additionalProperties: true
    DialectWrite:
      type: object
      required: [name, code]
      properties:
        name: { type: string, maxLength: 120 }
        code:
          type: string
          pattern: '^[^./\s]+$'
          maxLength: 32
          example: 游洋
        parent_id: { type: [integer, "null"] }
        sort_order: { type: integer, default: 0 }
        aliases:
          type: array
          description: 历史完整限定码；重新命名或归类后用于兼容解析。
          uniqueItems: true
          items: { type: string }
        description: { type: string }
        external_refs:
          type: object
          additionalProperties: true
    DialectPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/DialectRef" }

    PackageType:
      type: string
      enum: [orthodox, loan, popular, phonetic, romanization, uncertain]
    PackageRef:
      type: object
      required: [id, text, package_type]
      properties:
        id: { type: integer }
        text: { type: string }
        package_type: { $ref: "#/components/schemas/PackageType" }
    PackageDetail:
      allOf:
        - $ref: "#/components/schemas/PackageRef"
        - type: object
          required: [flavors, metadata, created_at]
          properties:
            unicode: { type: string }
            metadata: { type: object, additionalProperties: true }
            flavors:
              type: array
              items: { $ref: "#/components/schemas/FlavorRef" }
            created_at: { type: string, format: date-time }
    PackageWrite:
      type: object
      required: [text, package_type]
      properties:
        text: { type: string, maxLength: 120 }
        package_type: { $ref: "#/components/schemas/PackageType" }
        unicode: { type: string, maxLength: 80 }
        metadata: { type: object, additionalProperties: true }
    PackagePage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/PackageRef" }

    FlavorPackageMappingType:
      type: string
      enum: [primary, synonym, borrowed, disputed]
    FlavorPackageLink:
      type: object
      required: [id, package, mapping_type, note]
      properties:
        id: { type: integer }
        package: { $ref: "#/components/schemas/PackageRef" }
        mapping_type: { $ref: "#/components/schemas/FlavorPackageMappingType" }
        note: { type: string }
    FlavorPackageLinkWrite:
      type: object
      required: [package_id, mapping_type]
      properties:
        package_id: { type: integer }
        mapping_type: { $ref: "#/components/schemas/FlavorPackageMappingType" }
        note: { type: string, maxLength: 240 }

    FlavorRef:
      type: object
      required: [id, name, definition]
      properties:
        id: { type: integer }
        name: { type: string }
        definition: { type: string }
        mandarin:
          type: array
          items: { type: string }
    FlavorCard:
      allOf:
        - $ref: "#/components/schemas/FlavorRef"
        - type: object
          required: [packages, dialect_count, can_count]
          properties:
            packages:
              type: array
              items: { $ref: "#/components/schemas/PackageRef" }
            dialect_count: { type: integer, minimum: 0 }
            can_count: { type: integer, minimum: 0 }
    FlavorDetail:
      allOf:
        - $ref: "#/components/schemas/FlavorCard"
        - type: object
          required: [tags, package_links, pronunciations, created_at, updated_at]
          properties:
            tags:
              type: array
              items: { type: string }
            package_links:
              type: array
              description: 写法与义项之间带语义的关联；packages 是其精简展示。
              items: { $ref: "#/components/schemas/FlavorPackageLink" }
            geo_scope: { type: string }
            concepticon_id: { type: [string, "null"] }
            pronunciations:
              type: array
              items: { $ref: "#/components/schemas/PronunciationCard" }
            created_by: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    FlavorWrite:
      type: object
      required: [name, definition]
      properties:
        name: { type: string, maxLength: 160 }
        definition: { type: string }
        mandarin:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        geo_scope: { type: string }
        concepticon_id: { type: [string, "null"] }
        package_links:
          type: array
          uniqueItems: true
          description: 传入时整体替换该义项的写法关联；同一 package_id 不得重复。
          items: { $ref: "#/components/schemas/FlavorPackageLinkWrite" }
    FlavorPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/FlavorCard" }

    ReadingType:
      type: string
      enum: [general, literary, colloquial, other]
    PronunciationStatus:
      type: string
      enum: [draft, verified, disputed, rejected]
    PronunciationRef:
      type: object
      required: [id, ipa, reading_type, status]
      properties:
        id: { type: integer }
        ipa: { type: string }
        base_romanization:
          type: string
          description: 变调前或孤立读法的罗马字。
        surface_romanization:
          type: string
          description: 当前语流环境中实际读出的罗马字。
        reading_type: { $ref: "#/components/schemas/ReadingType" }
        status: { $ref: "#/components/schemas/PronunciationStatus" }
        is_canonical: { type: boolean }
    PronunciationCard:
      allOf:
        - $ref: "#/components/schemas/PronunciationRef"
        - type: object
          required: [package, flavor, dialect, evidence_count]
          properties:
            package: { $ref: "#/components/schemas/PackageRef" }
            flavor: { $ref: "#/components/schemas/FlavorRef" }
            dialect: { $ref: "#/components/schemas/DialectRef" }
            evidence_count:
              type: integer
              minimum: 0
              description: 指向该读音的 active Nameplate 数；去重 Can 数可由统计接口另行提供。
    PronunciationDetail:
      allOf:
        - $ref: "#/components/schemas/PronunciationCard"
        - type: object
          required: [sandhi_info, source_citation, attestations, created_at, updated_at]
          properties:
            usage_note: { type: string }
            sandhi_info: { type: object, additionalProperties: true }
            source_citation: { type: string }
            attestations:
              type: array
              description: 通过铭牌关联的录音证据；铭牌保留是谁、依据什么作出该关联。
              items: { $ref: "#/components/schemas/NameplateCard" }
            created_by: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PronunciationWrite:
      type: object
      required: [package_id, flavor_id, dialect_id, ipa, reading_type]
      properties:
        package_id: { type: integer }
        flavor_id: { type: integer }
        dialect_id: { type: integer }
        ipa: { type: string, maxLength: 120 }
        base_romanization: { type: string, maxLength: 120 }
        surface_romanization: { type: string, maxLength: 120 }
        reading_type: { $ref: "#/components/schemas/ReadingType" }
        usage_note: { type: string }
        sandhi_info: { type: object, additionalProperties: true }
        source_citation: { type: string, maxLength: 300 }
    PronunciationPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/PronunciationCard" }

    CanStatus:
      type: string
      enum: [unlabeled, pending, tentative, verified, disputed, rejected]
    CanRef:
      type: object
      required: [id, audio_url, concept_text]
      properties:
        id: { type: integer }
        audio_url: { type: string, format: uri }
        concept_text: { type: string }
    NameplateStatus:
      type: string
      enum: [active, withdrawn, superseded]
    NameplateSourceType:
      type: string
      enum: [creator, oral, fieldwork, book, article, archive, web, other]
    NameplateSource:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/NameplateSourceType" }
        title: { type: string, maxLength: 240 }
        attributed_to:
          type: string
          maxLength: 200
          description: 资料原作者、讲述人、编者或采集者；不同于系统 creator。
        locator:
          type: string
          maxLength: 160
          description: 页码、条目号、录音编号或其他可复查位置。
        url: { type: string, format: uri }
        note: { type: string, maxLength: 300 }
    NameplateRef:
      type: object
      required: [id, display_text, status, weight, is_primary, is_complete]
      properties:
        id: { type: integer }
        display_text:
          type: string
          description: 由原样写法或所关联规范实体生成的展示文本。
        status: { $ref: "#/components/schemas/NameplateStatus" }
        weight: { type: integer }
        is_primary: { type: boolean }
        is_complete:
          type: boolean
          description: 是否已具备成为主铭牌所需的 Package、Flavor 与 Dialect 主张。
    NameplatePreview:
      type: object
      required: [id, is_primary, display_text, text_content, definition, pronunciation_text, package, flavor, dialect, pronunciation, source, source_type, evidence_level, weight, support_count, comment_count, supported_by_current_user]
      properties:
        id: { type: integer }
        is_primary: { type: boolean }
        display_text:
          type: string
          description: 由原样写法或所关联规范实体生成的展示文本。
        text_content: { type: string }
        definition: { type: string }
        pronunciation_text: { type: string }
        package: { oneOf: [{ $ref: "#/components/schemas/PackageRef" }, { type: "null" }] }
        flavor: { oneOf: [{ $ref: "#/components/schemas/FlavorRef" }, { type: "null" }] }
        dialect: { oneOf: [{ $ref: "#/components/schemas/DialectRef" }, { type: "null" }] }
        pronunciation: { oneOf: [{ $ref: "#/components/schemas/PronunciationRef" }, { type: "null" }] }
        source: { $ref: "#/components/schemas/NameplateSource" }
        source_type: { $ref: "#/components/schemas/NameplateSourceType" }
        evidence_level: { type: integer, minimum: 1, maximum: 4 }
        weight: { type: integer }
        support_count:
          type: integer
          minimum: 0
          description: 该铭牌当前获得的背书总数。
        comment_count: { type: integer, minimum: 0 }
        supported_by_current_user:
          type: boolean
          description: 当前用户是否已背书该铭牌；游客恒为 false。
    CanCard:
      allOf:
        - $ref: "#/components/schemas/CanRef"
        - type: object
          required: [submitted_dialect, status, visibility, views, nameplate_count, nameplate_total, nameplate_previews, created_at]
          properties:
            submitted_dialect: { oneOf: [{ $ref: "#/components/schemas/DialectRef" }, { type: "null" }] }
            primary_nameplate: { oneOf: [{ $ref: "#/components/schemas/NameplateRef" }, { type: "null" }] }
            status: { $ref: "#/components/schemas/CanStatus" }
            visibility: { type: boolean }
            views: { type: integer, minimum: 0 }
            recorder_followed_by_me:
              type: boolean
              description: 当前用户是否已关注该罐的录制者；游客恒为 false。
            recommend_reasons:
              type: array
              items:
                type: string
                enum: [hot, same_dialect, following, search_match]
              description: 推荐理由标签；仅 feed=recommended 有值（游客或未命中个性化时为 ["hot"]），其余场景恒为空数组。
            nameplate_count: { type: integer, minimum: 0 }
            nameplate_total:
              type: integer
              minimum: 0
              description: 该罐 active 铭牌总数。
            nameplate_previews:
              type: array
              maxItems: 3
              items: { $ref: "#/components/schemas/NameplatePreview" }
              description: 该罐 active 铭牌按 weight 降序排列的前 3 条预览。
            duration_ms: { type: integer, minimum: 0 }
            created_at: { type: string, format: date-time }
    CanDetail:
      allOf:
        - $ref: "#/components/schemas/CanCard"
        - type: object
          required: [recorder, source_note, nameplates, transition_log, updated_at]
          properties:
            recorder:
              oneOf:
                - $ref: "#/components/schemas/UserRef"
                - type: "null"
              description: 账号已删除时为 null，罐头本身继续保留。
            source_note: { type: string }
            nameplates:
              type: array
              items: { $ref: "#/components/schemas/NameplateDetail" }
            transition_log:
              type: array
              items: { $ref: "#/components/schemas/TransitionLog" }
            verifier: { oneOf: [{ $ref: "#/components/schemas/UserRef" }, { type: "null" }] }
            metadata: { type: object, additionalProperties: true }
            updated_at: { type: string, format: date-time }
    InitialNameplate:
      type: object
      required: [source]
      anyOf:
        - required: [package_id]
        - required: [flavor_id]
        - required: [dialect_id]
        - required: [pronunciation_id]
        - required: [text_content]
        - required: [pronunciation_text]
      properties:
        package_id: { type: integer }
        flavor_id: { type: integer }
        dialect_id:
          type: integer
          description: 省略时继承 Can.submitted_dialect_id。
        pronunciation_id: { type: integer }
        text_content: { type: string, maxLength: 160 }
        definition: { type: string }
        pronunciation_text:
          type: string
          maxLength: 160
          description: 来源中的原样 IPA、罗马字或其他读音转写。
        package_type: { $ref: "#/components/schemas/PackageType" }
        evidence_level: { type: integer, minimum: 1, maximum: 4, default: 1 }
        source: { $ref: "#/components/schemas/NameplateSource" }
    CanWrite:
      type: object
      required: [audio_url, submitted_dialect_id]
      properties:
        audio_url: { type: string, format: uri }
        submitted_dialect_id:
          type: integer
          description: 装罐时的采集提示，不是最终规范分类；主铭牌可提出不同 Dialect。
        concept_text:
          type: string
          maxLength: 200
          description: >-
            普通话概念。自由装罐必填；补录音模式可省略，后端按
            initial_nameplate.flavor_id 对应义项名称回填；两者均缺失时返回 400。
        source_note: { type: string, maxLength: 300 }
        duration_ms: { type: integer, minimum: 0 }
        initial_nameplate: { $ref: "#/components/schemas/InitialNameplate" }
    CanUpdate:
      type: object
      minProperties: 1
      properties:
        submitted_dialect_id: { type: [integer, "null"] }
        concept_text: { type: string, maxLength: 200 }
        source_note: { type: string, maxLength: 300 }
        metadata: { type: object, additionalProperties: true }
    CanPage:
      allOf:
        - $ref: "#/components/schemas/PageBase"
        - type: object
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/CanCard" }

    NameplateCard:
      allOf:
        - $ref: "#/components/schemas/NameplateRef"
        - type: object
