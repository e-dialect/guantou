openapi: 3.1.0
info:
  title: 乡声集盒 API
  version: 1.0.0
  summary: 乡声集盒预期 API v1 契约
  description: |
    本文件是预期 API v1 的规范性来源，不表示当前实现已经完成。
    Package 表示规范化写法，Flavor 表示标准化义项，Pronunciation
    表示某写法在某义项、某方言下的一种读音，Can 表示实际录音证据。
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-only
  x-lifecycle: proposed
servers:
  - url: /
    description: 当前站点根路径
x-visitor-tracking:
  request-header: X-Visitor-ID
  response-header: X-Visitor-ID
  description: 客户端可传入；缺失时由服务端生成并回写。只用于访问追踪和审计归因，不授予写权限。
tags:
  - name: Auth
    description: 登录与令牌刷新。
  - name: Users
    description: 注册、公开资料与本人账号设置。
  - name: Dialects
    description: 按需展开的方言关系树与限定名解析。
  - name: Packages
    description: 规范化写法资源。
  - name: Flavors
    description: 标准化义项及其写法关联。
  - name: Pronunciations
    description: 写法、义项和方言三元组上的抽象读音。
  - name: Cans
    description: 读音或义项的实际录音证据。
  - name: Nameplates
    description: 用户或资料来源对录音提出的、可查询且可追溯的结构化著录主张。
  - name: Shelves
    description: 用户维护的收藏集盒。
  - name: Search
    description: 聚合搜索、建议词和热门搜索。
  - name: Files
    description: 受控文件上传与删除。
  - name: Announcements
    description: 公开公告与管理操作。
  - name: SiteSettings
    description: 公开站点配置与管理操作。
  - name: Notifications
    description: 本人的站内通知与管理员发送操作。
  - name: Comments
    description: 录音证据与资料铭牌上的讨论评论（二级评论层级）。
  - name: Themes
    description: 公开主题目录，以及当前用户的装扮配置、收藏、搭配与权益。
  - name: EntriesV2
    description: 以同一词及读音身份为边界的词条、义项、写法、概念与地区读音。
  - name: RecordingsV2
    description: 可独立存在并通过多角色关系关联词条的录音证据。
  - name: CurationV2
    description: 整理员权限、旧库待审核候选与争议待办。

paths:
  /login/:
    post:
      tags: [Auth]
      operationId: login
      summary: 密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /login/refresh/:
    post:
      tags: [Auth]
      operationId: refreshLogin
      summary: 刷新访问令牌
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /login/forget/:
    get:
      tags: [Auth]
      operationId: lookupPasswordResetAccount
      summary: 按用户名查询找回密码用的脱敏邮箱
      security: []
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 账号已绑定邮箱
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_masked: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Auth]
      operationId: sendPasswordResetCode
      summary: 向账号绑定邮箱发送重置验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: 请求已受理。未配置 SMTP 的演示环境会额外返回 demo_code。
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_masked: { type: string }
                  retry_after: { type: integer, minimum: 0 }
                  delivery: { type: string, enum: [demo] }
                  demo_code: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      tags: [Auth]
      operationId: resetPassword
      summary: 用邮箱验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, code]
              properties:
                username: { type: string }
                password: { type: string }
                code: { type: string }
      responses:
        "200":
          description: 重置成功
        "400": { $ref: "#/components/responses/BadRequest" }

  /users/email-code/:
    post:
      tags: [Users]
      operationId: sendEmailCode
      summary: 发送邮箱验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, purpose]
              properties:
                email: { type: string, format: email }
                purpose:
                  type: string
                  enum: [register, bind, reset_password]
                  description: register 注册；bind 绑定或更换邮箱；reset_password 找回密码
      responses:
        "200":
          description: 请求已受理。绑定用途下，邮箱已被占用时返回 409。未配置 SMTP 的演示环境会额外返回 demo_code。
          content:
            application/json:
              schema:
                type: object
                properties:
                  retry_after: { type: integer, minimum: 0 }
                  delivery: { type: string, enum: [demo] }
                  demo_code: { type: string, description: 仅演示环境返回，生产环境不会出现 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 搜索公开用户资料
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Users]
      operationId: registerUser
      summary: 邮箱注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/me/:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 获取本人完整资料
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 本人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPrivateProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: 修改本人资料
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: 修改后的资料；若修改了 username，响应会带新 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{user_id}/:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: 获取用户资料与贡献计数
      security: []
      responses:
        "200":
          description: |
            `{ user, contribution }`。访客只收到公开计数；
            登录且路径 id 为本人时，`user` 含私有字段，`contribution` 额外含 `*_uploaded`，
            并可能返回 `notification`。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Users]
      operationId: updateUser
      summary: 修改本人资料
      description: |
        路径 id 必须是当前登录用户。请求体为 `{ user: UserUpdate }`。
        修改 username 后旧 token 失效，响应返回新 token。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: 修改后的资料与新 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: 用户名或手机号已被占用
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users/{user_id}/password/:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: 修改本人密码
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldpassword, newpassword]
              properties:
                oldpassword: { type: string, minLength: 1, maxLength: 32 }
                newpassword: { type: string, minLength: 6, maxLength: 32 }
      responses:
        "200":
          description: 修改成功，返回新 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserUpdateResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/{user_id}/email/:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Users]
      operationId: updateUserEmail
      summary: 绑定或更换邮箱
      description: 需先用 purpose=bind 领取验证码。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/UserPrivateProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dialects/:
    get:
      tags: [Dialects]
      operationId: listDialects
      summary: 查询方言节点
      security: []
      parameters:
        - name: flat
          in: query
          schema: { type: boolean, default: false }
          description: 为 true 时忽略 parent_id，分页返回全部节点的轻量引用，供选择器按需使用。
        - name: parent_id
          in: query
          schema: { type: integer }
          description: 只返回指定节点的直接子节点；省略时返回根节点
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 方言节点列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialectPage"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Dialects]
      operationId: createDialect
      summary: 创建方言节点
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialectWrite"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialectDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /dialects/resolve/:
    get:
      tags: [Dialects]
      operationId: resolveDialect
      summary: 解析规范限定名或历史 alias
      security: []
      parameters:
        - name: qualified_code
          in: query
          required: true
          schema: { type: string, example: 闽.莆仙.仙游.游洋 }
      responses:
        "200":
          description: 解析后的稳定节点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialectDetail"
        "404": { $ref: "#/components/responses/NotFound" }

  /dialects/{dialect_id}/:
    parameters:
      - $ref: "#/components/parameters/DialectId"
    get:
      tags: [Dialects]
      operationId: getDialect
      summary: 获取方言节点
      security: []
      parameters:
        - name: expand
          in: query
          schema:
            type: array
            items: { type: string, enum: [ancestors, children] }
          style: form
          explode: false
      responses:
        "200":
          description: 方言节点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialectDetail"
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Dialects]
      operationId: updateDialect
      summary: 修改或重新归类方言节点
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialectWrite"
      responses:
        "200":
          description: 修改后的节点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialectDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /packages/:
    get:
      tags: [Packages]
      operationId: listPackages
      summary: 查询写法
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: package_type
          in: query
          schema: { $ref: "#/components/schemas/PackageType" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 写法列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackagePage"
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Packages]
      operationId: createPackage
      summary: 提交写法
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageWrite" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /packages/{package_id}/:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [Packages]
      operationId: getPackage
      summary: 获取写法详情
      security: []
      responses:
        "200":
          description: 写法详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Packages]
      operationId: updatePackage
      summary: 修改写法
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageWrite" }
      responses:
        "200":
          description: 修改后的写法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /flavors/:
    get:
      tags: [Flavors]
      operationId: listFlavors
      summary: 查询义项
      security: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: package_id
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/DialectFilter"
        - $ref: "#/components/parameters/DialectScope"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 义项列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlavorPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Flavors]
      operationId: createFlavor
      summary: 提交义项
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlavorWrite" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlavorDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /flavors/{flavor_id}/:
    parameters:
      - $ref: "#/components/parameters/FlavorId"
    get:
      tags: [Flavors]
      operationId: getFlavor
      summary: 获取义项详情
      security: []
      responses:
        "200":
          description: 义项详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlavorDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Flavors]
      operationId: updateFlavor
      summary: 修改义项
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlavorWrite" }
      responses:
        "200":
          description: 修改后的义项
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlavorDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /pronunciations/:
    get:
      tags: [Pronunciations]
      operationId: listPronunciations
      summary: 查询读音
      security: []
      parameters:
        - name: package_id
          in: query
          schema: { type: integer }
        - name: flavor_id
          in: query
          schema: { type: integer }
        - $ref: "#/components/parameters/DialectFilter"
        - $ref: "#/components/parameters/DialectScope"
        - name: reading_type
          in: query
          schema: { $ref: "#/components/schemas/ReadingType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PronunciationStatus" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 读音列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [Pronunciations]
      operationId: createPronunciation
      summary: 提交读音
      description: package_id 与 flavor_id 必须已建立关联；相同三元组允许多条不同读音。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PronunciationWrite" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /pronunciations/{pronunciation_id}/:
    parameters:
      - $ref: "#/components/parameters/PronunciationId"
    get:
      tags: [Pronunciations]
      operationId: getPronunciation
      summary: 获取读音详情与录音证据
      security: []
      responses:
        "200":
          description: 读音详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Pronunciations]
      operationId: updatePronunciation
      summary: 修改读音
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PronunciationWrite" }
      responses:
        "200":
          description: 修改后的读音
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PronunciationDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Pronunciations]
      operationId: deletePronunciation
