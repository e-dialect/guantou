      properties:
        package_id: { type: [integer, "null"] }
        flavor_id: { type: [integer, "null"] }
        dialect_id: { type: [integer, "null"] }
        pronunciation_id: { type: [integer, "null"] }
        text_content: { type: string, maxLength: 160 }
        definition: { type: string }
        pronunciation_text: { type: string, maxLength: 160 }
