      summary: 查询罐头
      security: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/CanStatus" }
        - name: pronunciation_id
          in: query
          schema: { type: integer }
          description: 通过 active Nameplate 关联的规范读音筛选。
        - name: flavor_id
          in: query
          schema: { type: integer }
          description: 通过 active Nameplate 的义项主张筛选。
        - $ref: "#/components/parameters/DialectFilter"
        - $ref: "#/components/parameters/DialectScope"
        - name: submitted_dialect_id
          in: query
          schema: { type: integer }
          description: 只筛选装罐时的初始方言提示，不代表规范分类。
        - name: feed
          in: query
          schema:
            type: string
            enum: [dialect, following, recommended]
          description: 首页流式列表场景；recommended 按推荐分值排序并附带推荐理由。
        - name: mine
          in: query
          schema: { type: boolean, default: false }
        - name: needs_label
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 罐头列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
