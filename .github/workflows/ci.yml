name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/guantou
    env:
      SECRET_KEY: ci-secret-key
      JWT_KEY: ci-jwt-key
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/guantou/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test guantou announcements user siteconfig files inbox

      - name: Check backend formatting
        run: black --check announcements guantou user siteconfig files inbox utils config

  frontend-unit:
    name: Frontend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Lint frontend
        run: yarn lint

      - name: Run frontend unit tests
        run: yarn test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Build H5 frontend
        run: yarn build

      - name: Build WeChat mini program frontend
        run: yarn build:mp-weixin

  e2e-h5:
    name: H5 E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend-build
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --production=false

      - name: Install Playwright browser
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      - name: Start Docker stack
        run: docker compose up -d --build

      - name: Wait for frontend
        working-directory: frontend
        run: yarn wait-on http://localhost:8181

      - name: Run H5 smoke tests
        working-directory: frontend
        run: yarn test:e2e:h5

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color backend frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose config
        run: docker compose config

      - name: Build images
        run: docker compose build backend frontend
