name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR commit messages
        run: node scripts/check-commit-messages.js "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/guantou
    env:
      SECRET_KEY: ci-secret-key
      JWT_KEY: ci-jwt-key
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/guantou/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test guantou announcements user siteconfig files inbox

      - name: Check backend formatting
        run: black --check announcements guantou user siteconfig files inbox utils config

      - name: Run material tool tests
        working-directory: .
        run: python -m unittest discover tools/materials/tests

  frontend-unit:
    name: Frontend Unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Lint frontend
        run: yarn lint

      - name: Run frontend unit tests
        run: yarn test:unit

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --production=false

      - name: Build H5 frontend
        run: yarn build

      - name: Build WeChat mini program frontend
        run: yarn build:mp-weixin

  e2e-h5:
    name: H5 E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --production=false

      - name: Install Playwright browser
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/guantou
          load: true
          tags: guantou-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: guantou-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start Docker stack
        run: docker compose up -d

      - name: Wait for H5 stack
        working-directory: frontend
        run: yarn wait:e2e:h5

      - name: Run H5 smoke tests
        working-directory: frontend
        run: yarn test:e2e:h5

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --no-color backend frontend

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/guantou
          tags: guantou-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: guantou-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
